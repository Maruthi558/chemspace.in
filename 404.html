<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ChemSpace</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages SPA Routing
      // Automatically detect repo subfolder or custom root domain to prevent 404 errors
      var l = window.location;
      var isRepoSubfolder = Boolean(
        l.pathname.startsWith('/chemspace.in') ||
        (l.hostname.indexOf('github.io') !== -1 && l.pathname.split('/')[1] === 'chemspace.in')
      );
      var pathSegmentsToKeep = isRepoSubfolder ? 1 : 0;
      var pathname = l.pathname;
      var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
      var route = pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
      var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        route + search + l.hash;
      l.replace(target);
    </script>
  </head>
  <body>
  </body>
</html>
