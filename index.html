<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChemSpace</title>
    <meta name="description" content="Professional chemical computing environment: 2D/3D ChemDraw CAD, RDKit physicochemical descriptors, FTIR/NMR spectroscopy prediction, quantum DFT solvers, and IBM RXN retrosynthesis." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="antialiased min-h-screen font-sans">
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: decode route preserved from 404.html
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module">
      // GitHub Pages Static Host Fallback:
      // If loaded on GitHub Pages directly from repository root without Vite dev server,
      // dynamically load the pre-compiled production assets.
      if (window.location.hostname.includes('github.io') && !window.__vite_plugin_react_preamble_installed__) {
        const basePath = window.location.pathname.startsWith('/chemspace.in') ? '/chemspace.in/' : './';
        const cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.crossOrigin = 'anonymous';
        cssLink.href = basePath + 'assets/index.css';
        document.head.appendChild(cssLink);

        const jsScript = document.createElement('script');
        jsScript.type = 'module';
        jsScript.crossOrigin = 'anonymous';
        jsScript.src = basePath + 'assets/index.js';
        document.body.appendChild(jsScript);
      }
    </script>
  </body>
</html>
