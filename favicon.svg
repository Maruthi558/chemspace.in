<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- ChemSpace Precision Unified Tab Emblem -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer Hexagonal Molecular Geometry -->
  <polygon
    points="32,10 52,21.5 52,44.5 32,56 12,44.5 12,21.5"
    stroke="#f8fafc"
    stroke-width="3.5"
    stroke-linejoin="round"
  />

  <!-- Internal Resonant Chemical Bonds -->
  <line x1="32" y1="10" x2="32" y2="23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="44.5" x2="41" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="12" y1="44.5" x2="23" y2="38" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Molecular Orbital Ring (ChemSpace Signature Orange Accent) -->
  <ellipse
    cx="32"
    cy="33"
    rx="21"
    ry="8.5"
    transform="rotate(-28 32 33)"
    stroke="#f97316"
    stroke-width="3"
    stroke-dasharray="4 3"
  />

  <!-- Central Emerald Nucleus Node -->
  <circle cx="32" cy="33" r="5.5" fill="#10b981" />
  <circle cx="32" cy="33" r="2.2" fill="#ffffff" />

  <!-- Coordinate Nodes -->
  <circle cx="47.5" cy="24.5" r="3" fill="#f97316" />
  <circle cx="16.5" cy="41.5" r="2.5" fill="#f8fafc" />
</svg>